[project]
name = "lattice-helmet"
version = "0.1.0"
description = "Field-driven lattice infill for helmet shells"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-image", "trimesh", "manifold3d", "lxml", "networkx"]

[project.optional-dependencies]
decimate = ["fast_simplification"]
preview = ["matplotlib"]

[project.scripts]
lattice-helmet = "lattice_helmet.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lattice_helmet"]
